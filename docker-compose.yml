version: '3'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    command: "dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    working_dir: /app
    volumes:
      - ./frontend:/app

  database:
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root
      MYSQL_DATABASE: garden_control
      MYSQL_USER: user
      MYSQL_PASSWORD: change_me
    volumes:
      - ./backend/database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-pchange_me"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  db_data: